# MATS site check (change request 74). Every 5 minutes: open the live site's health page. If it fails twice in a row
# (1 minute apart), this run fails on purpose with "MATS site is DOWN", and GitHub emails the account
# (Matsadminteam -> its email) about the failed run. Only the first failed check sends an email; while the site stays
# down, later checks pass quietly. When it works again, the next outage emails again.
# Public repository on purpose: free and unlimited, so it uses none of the private repositories' Actions minutes.
name: Site check
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '30 6 1 * *'   # monthly keep-alive
  workflow_dispatch:
    inputs:
      test:
        description: 'Pretend the site is down (sends the email, to test it)'
        type: boolean
        default: true
permissions:
  actions: write   # only for the monthly keep-alive below

concurrency:
  group: site-check
  cancel-in-progress: false

env:
  URL: https://matsapp.org/api/health

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Last known state
        uses: actions/cache/restore@v4
        with:
          path: state.txt
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check the site
        id: c
        env:
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: |
          probe() { curl -s -m 30 -o body.txt -w '%{http_code}' "$URL" || echo 000; }
          code=$(probe)
          if [ "$code" != 200 ] || ! grep -q '"ok":true' body.txt; then sleep 60; code=$(probe); fi
          if [ "$code" = 200 ] && grep -q '"ok":true' body.txt; then now=up; else now=down; fi
          before=$(cat state.txt 2>/dev/null || echo up)
          echo "site: $now (HTTP $code), before: $before"
          if [ "$TEST" = true ]; then
            echo "::error title=TEST: MATS site is DOWN::This is a test of the site-down email (the site itself is $now)."
            exit 1
          fi
          echo "$now" > state.txt
          if [ "$now" = down ] && [ "$before" != down ]; then
            echo "::error title=MATS site is DOWN::matsapp.org health check failed twice (HTTP $code). Tell Claude: the site is down."
            exit 1
          fi

      - name: Remember state
        if: always() && hashFiles('state.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: state-${{ github.run_id }}

      - name: Keep the schedule alive (GitHub pauses schedules after 60 quiet days)
        if: github.event.schedule == '30 6 1 * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check.yml/enable" && echo "schedule kept alive"
